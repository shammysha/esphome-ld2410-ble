      internal: ${disabled}
    max_move_distance_gate:
      id: ${place}_max_move_distance
      name: ${place} max move distance
      internal: ${disabled}
    max_still_distance_gate:
      id: ${place}_max_still_distance
      name: ${place} max still distance
      internal: ${disabled}
    light_threshold:
      id: ${place}_light_threshold
      name: ${place} light threshold
      internal: ${disabled}
    g0:
      move_threshold:
        name: ${place} g0 move threshold
        internal: ${disabled}
      still_threshold:
        name: ${place} g0 still threshold
        internal: ${disabled}
    g1:
      move_threshold:
        name: ${place} g1 move threshold
        internal: ${disabled}
      still_threshold:
        name: ${place} g1 still threshold
        internal: ${disabled}
    g2:
      move_threshold:
        name: ${place} g2 move threshold
        internal: ${disabled}
      still_threshold:
        name: ${place} g2 still threshold
        internal: ${disabled}
    g3:
      move_threshold:
        name: ${place} g3 move threshold
        internal: ${disabled}
      still_threshold:
        name: ${place} g3 still threshold
        internal: ${disabled}
    g4:
      move_threshold:
        name: ${place} g4 move threshold
        internal: ${disabled}
      still_threshold:
        name: ${place} g4 still threshold
        internal: ${disabled}
    g5:
