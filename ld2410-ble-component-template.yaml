      still_threshold:
        name: ${place} g4 still threshold
        internal: ${disabled}
    g5:
      move_threshold:
        name: ${place} g5 move threshold
        internal: ${disabled}
      still_threshold:
        name: ${place} g5 still threshold
        internal: ${disabled}
    g6:
      move_threshold:
        name: ${place} g6 move threshold
