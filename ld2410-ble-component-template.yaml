substitutions:
  place: 'somewhere'
  mac_address: '00:00:00:00:00:00'
  mac_suffix: 'unknown'
  password: "HiLink"
  disabled: false

# See ld2410-uart-ble-template.yaml's comment for the full reasoning -- same
# active/inactive-file-swap mechanism (for esp32_ble_tracker:/ble_client:/ld2410_ble: only),
# same upstream-bug motivation, same `!remove`-in-place idiom kept for the entity platform
# blocks below.
packages:
  emi: !include
    file: ${"ld2410-ble-component-inactive.yaml" if disabled else "ld2410-ble-component-active.yaml"}
    vars:
      place: ${place}
      mac_address: ${mac_address}
      mac_suffix: ${mac_suffix}
      password: ${password}

binary_sensor:
  - platform: ld2410_ble
    id: ${place}_emi_binary_sensors
    ld2410_id: ${place}_emi
    has_target:
      id: ${place}_target
      name: ${place} Target
      internal: ${disabled}
    has_moving_target:
      id: ${place}_moving_target
      name: ${place} Moving Target
      internal: ${disabled}
    has_still_target:
      id: ${place}_still_target
      name: ${place} Still Target
      internal: ${disabled}
    out_pin_presence_status:
      id: ${place}_out_pin_presence_status
      name: ${place} Out Pin Presence Status
      internal: ${disabled}
    ble_status:
      id: ${place}_ble_status
      name: ${place} BLE Status
      internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_binary_sensors"}

text_sensor:
  - platform: ld2410_ble
    id: ${place}_emi_text_sensors
    ld2410_id: ${place}_emi
    version:
      id: ${place}_firmware
      name: ${place} Firmware
      internal: ${disabled}
    mac_address:
      id: ${place}_mac
      name: ${place} Mac Address
      internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_text_sensors"}

sensor:
  - platform: ld2410_ble
    id: ${place}_emi_sensors
    ld2410_id: ${place}_emi
    moving_distance:
      id: ${place}_moving_distance
      name: ${place} Moving Distance
      internal: ${disabled}
    still_distance:
      id: ${place}_still_distance
      name: ${place} Still Distance
      internal: ${disabled}
    moving_energy:
      id: ${place}_moving_energy
      name: ${place} Moving Energy
      internal: ${disabled}
    still_energy:
      id: ${place}_still_energy
      name: ${place} Still Energy
      internal: ${disabled}
    detection_distance:
      id: ${place}_detection_distance
      name: ${place} Detection Distance
      internal: ${disabled}
    light:
      id: ${place}_light
      name: ${place} Light
      internal: ${disabled}
    g0:
      move_energy:
        name: ${place} g0 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g0 still energy
        internal: ${disabled}
    g1:
      move_energy:
        name: ${place} g1 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g1 still energy
        internal: ${disabled}
    g2:
      move_energy:
        name: ${place} g2 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g2 still energy
        internal: ${disabled}
    g3:
      move_energy:
        name: ${place} g3 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g3 still energy
        internal: ${disabled}
    g4:
      move_energy:
        name: ${place} g4 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g4 still energy
        internal: ${disabled}
    g5:
      move_energy:
        name: ${place} g5 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g5 still energy
        internal: ${disabled}
    g6:
      move_energy:
        name: ${place} g6 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g6 still energy
        internal: ${disabled}
    g7:
      move_energy:
        name: ${place} g7 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g7 still energy
        internal: ${disabled}
    g8:
      move_energy:
        name: ${place} g8 move energy
        internal: ${disabled}
      still_energy:
        name: ${place} g8 still energy
        internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_sensors"}

switch:
  - platform: ld2410_ble
    id: ${place}_emi_switches
    ld2410_id: ${place}_emi
    engineering_mode:
      id: ${place}_engineering_mode
      name: ${place} engineering mode
      internal: ${disabled}
    bluetooth:
      id: ${place}_bluetooth
      name: ${place} control bluetooth
      internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_switches"}

button:
  - platform: ld2410_ble
    id: ${place}_emi_buttons
    ld2410_id: ${place}_emi
    factory_reset:
      id: ${place}_factory_reset
      name: ${place} factory reset
      internal: ${disabled}
    restart:
      id: ${place}_restart
      name: ${place} restart
      internal: ${disabled}
    query_params:
      id: ${place}_query_params
      name: ${place} query params
      internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_buttons"}

select:
