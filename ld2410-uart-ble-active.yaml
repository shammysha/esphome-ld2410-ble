substitutions:
  place: 'somewhere'
  mac_address: '00:00:00:00:00:00'
  mac_suffix: 'unknown'
  password: "HiLink"
  tx: 'unknown'
  rx: 'unknown'

# Only ever included (via ld2410-uart-ble-template.yaml's dynamic !include) when this place
# is NOT disabled -- so unlike the entity platform blocks in ld2410-uart-ble-template.yaml
# itself, nothing here needs a `!remove ${disabled and ...}` companion entry: when disabled,
# this whole file is swapped out for ld2410-uart-ble-inactive.yaml instead, so none of these
# keys exist in the merged config at all. See ld2410-uart-ble-template.yaml's own comment for
# why that swap is necessary specifically for THESE four domains (a real upstream ESPHome
# bug, not just style) and why the entity platform blocks don't need the same treatment.

esp32_ble_tracker:

uart:
  - id: ${place}_uart
    tx_pin: ${tx}
    rx_pin: ${rx}
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

# If mac_suffix (below) is set, mac_address here is just a placeholder -- it gets
# overwritten once a device matching the suffix is found by scanning. Only fill in a
# real mac_address if you already know it and want to skip discovery.
ble_client:
  - mac_address: ${mac_address}
    id: ${place}_ble_client

# UART is preferred whenever it has produced a valid frame recently; BLE (kept connected in
# the background) is used as a fallback if the wired link goes quiet. See active_transport
# below for a diagnostic showing which one is currently in use.
ld2410_ble:
  - id: ${place}_emi
    uart_id: ${place}_uart
    ble_client_id: ${place}_ble_client
    mac_suffix: ${mac_suffix}
    password: ${password}
