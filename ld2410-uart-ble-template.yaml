substitutions:
  place: 'somewhere'
  mac_address: '00:00:00:00:00:00'
  mac_suffix: 'unknown'
  password: "HiLink"
  tx: 'unknown'
  rx: 'unknown'
  disabled: false

# `disabled: true` picks ld2410-uart-ble-inactive.yaml (declares nothing at all for this
# place) instead of ld2410-uart-ble-active.yaml (the real esp32_ble_tracker/uart/ble_client/
# ld2410_ble declarations) -- a dynamic !include, resolved via Jinja before
# substitutions/packages merging, rather than the `!remove`-in-place idiom the entity
# platform blocks below still use.
#
# Why these four domains specifically need the whole-file swap instead of `!remove`ing their
# list items in place (which is what this file used to do, and what the entity platform
# blocks below still do): `!remove` only ever empties a list's items, it can't delete the
# list's own top-level key from the merged config -- a `!remove`d-down `ble_client:` block
# still leaves `ble_client: []` present. ESPHome bundles a domain's C++ sources whenever its
# key is present at all, regardless of item count, which trips a genuine upstream ESPHome
# bug: ble_client's own ble_client.h/automation.h reference stale symbol names
# (espbt::ESPBTDevice, esp32_ble::UUID_STR_LEN) that only resolve once ble_client's own
# to_code() has actually run for a real instance -- domain-loading it with zero real
# instances fails to compile. Reproduced minimally with nothing but a bare `ble_client: []`
# in an otherwise-unrelated config, so this isn't fixable from ld2410_ble's own Python.
#
# The entity platform blocks below don't have this problem -- `platform: ld2410_ble` under
# sensor:/binary_sensor:/etc. is an ordinary entity list, not a component with its own
# top-level domain key masking a C++ bug, so the established `!remove` companion pattern
# (keeping both the real entry and its own removal directive in the same list) stays exactly
# as it always was. That also matters for compatibility with a device's own `!extend`
# targeting e.g. `${place}_emi_sensors`: ESPHome silently no-ops an !extend whose target id is
# *also* being !remove'd in the same merged list, which is what lets a device yaml keep an
# unconditional `!extend ${place}_emi_sensors` even when this place ends up disabled.
packages:
  emi: !include
    file: ${"ld2410-uart-ble-inactive.yaml" if disabled else "ld2410-uart-ble-active.yaml"}
    vars:
      place: ${place}
      mac_address: ${mac_address}
      mac_suffix: ${mac_suffix}
      password: ${password}
      tx: ${tx}
      rx: ${rx}

binary_sensor:
  - platform: ld2410_ble
    id: ${place}_emi_binary_sensors
    ld2410_id: ${place}_emi
    has_target:
      id: ${place}_target
      name: ${place} Target
      internal: ${disabled}
    has_moving_target:
      id: ${place}_moving_target
      name: ${place} Moving Target
      internal: ${disabled}
    has_still_target:
      id: ${place}_still_target
      name: ${place} Still Target
      internal: ${disabled}
    out_pin_presence_status:
      id: ${place}_out_pin_presence_status
      name: ${place} Out Pin Presence Status
      internal: ${disabled}
    ble_status:
      id: ${place}_ble_status
      name: ${place} BLE Status
      internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_binary_sensors"}

text_sensor:
  - platform: ld2410_ble
    id: ${place}_emi_text_sensors
    ld2410_id: ${place}_emi
    version:
      id: ${place}_firmware
      name: ${place} Firmware
      internal: ${disabled}
    mac_address:
      id: ${place}_mac
      name: ${place} Mac Address
      internal: ${disabled}
    active_transport:
      id: ${place}_active_transport
      name: ${place} Active Transport
      internal: ${disabled}

  - id: !remove ${disabled and place + "_emi_text_sensors"}

