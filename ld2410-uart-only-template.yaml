substitutions:
  place: 'somewhere'
  password: "HiLink"
  tx: 'unknown'
  rx: 'unknown'
  disabled: false

external_components:
  - source:
      type: local
      path: components
    components: [ld2410_ble]

# `disabled: true` is a *runtime* flag on ld2410_ble: itself, not a `!remove` of this block --
# uart:/ld2410_ble: are deliberately always real, never-emptied domains (see
# ld2410-uart-ble-template.yaml's comment for the full BLE-side reasoning; the same design
# applies here even though this template has no ble_client: at all). When disabled, ld2410_ble
# itself skips all UART activity at runtime (no read), and forces every entity below to
# internal: true regardless of this file not setting it per-field -- see
# force_internal_if_disabled() in components/ld2410_ble/__init__.py.
uart:
  - id: ${place}_uart
    tx_pin: ${tx}
    rx_pin: ${rx}
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

# No ble_client_id at all: a pure UART-only instance genuinely doesn't compile in any
# BLE/esp32_ble_tracker machinery (smaller flash/RAM footprint than either the BLE-only or
# dual-transport templates) -- see README's "ld2410_ble: also takes..." table for the full
# ble_client_id/uart_id requirement, and the project's own commit history for how this
# became possible (it used to require at least a ble_client_id, no longer does).
ld2410_ble:
  - id: ${place}_emi
    uart_id: ${place}_uart
    password: ${password}
    disabled: ${disabled}

binary_sensor:
  - platform: ld2410_ble
    id: ${place}_emi_binary_sensors
    ld2410_id: ${place}_emi
    has_target:
      id: ${place}_target
      name: ${place} Target
    has_moving_target:
      id: ${place}_moving_target
      name: ${place} Moving Target
    has_still_target:
      id: ${place}_still_target
      name: ${place} Still Target
    out_pin_presence_status:
