    id: ${place}_emi_switches
    ld2410_id: ${place}_emi
    engineering_mode:
      id: ${place}_engineering_mode
      name: ${place} engineering mode
    bluetooth:
      id: ${place}_bluetooth
      name: ${place} control bluetooth

button:
