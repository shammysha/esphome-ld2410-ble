substitutions:
  place: 'somewhere'
  mac_address: '00:00:00:00:00:00'
  mac_suffix: 'unknown'
  password: "HiLink"
  tx: 'unknown'
  rx: 'unknown'
  disabled: false

external_components:
  - source:
      type: local
      path: ../components
    components: [ld2410_ble]

# `disabled: true` is a *runtime* flag on ld2410_ble: itself, not a `!remove` of this block --
# uart:/ble_client:/ld2410_ble: are deliberately always real, never-emptied domains. Emptying
# them via !remove hits a genuine upstream ESPHome bug (ble_client's own headers reference
# stale symbols that only resolve once its to_code() has run for a real instance -- see the
# component's own __init__.py for the full story). When disabled, ld2410_ble itself skips all
# BLE/UART activity at runtime (no connect/scan/read), and forces every entity below to
# internal: true regardless of this file not setting it per-field -- see
# force_internal_if_disabled() in components/ld2410_ble/__init__.py.
esp32_ble_tracker:

uart:
  - id: ${place}_uart
    tx_pin: ${tx}
    rx_pin: ${rx}
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

# If mac_suffix (below) is set, mac_address here is just a placeholder -- it gets
# overwritten once a device matching the suffix is found by scanning. Only fill in a
# real mac_address if you already know it and want to skip discovery.
ble_client:
  - mac_address: ${mac_address}
    id: ${place}_ble_client

# UART is preferred whenever it has produced a valid frame recently; BLE (kept connected in
# the background) is used as a fallback if the wired link goes quiet. See active_transport
# below for a diagnostic showing which one is currently in use.
ld2410_ble:
  - id: ${place}_emi
    uart_id: ${place}_uart
    ble_client_id: ${place}_ble_client
    mac_suffix: ${mac_suffix}
    password: ${password}
    disabled: ${disabled}

binary_sensor:
  - platform: ld2410_ble
    id: ${place}_emi_binary_sensors
    ld2410_id: ${place}_emi
    has_target:
      id: ${place}_target
      name: ${place} Target
    has_moving_target:
      id: ${place}_moving_target
      name: ${place} Moving Target
    has_still_target:
      id: ${place}_still_target
      name: ${place} Still Target
    out_pin_presence_status:
      id: ${place}_out_pin_presence_status
      name: ${place} Out Pin Presence Status
    ble_status:
      id: ${place}_ble_status
      name: ${place} BLE Status

text_sensor:
