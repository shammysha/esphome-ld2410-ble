        name: ${place} g5 still energy
    g6:
      move_energy:
        name: ${place} g6 move energy
      still_energy:
        name: ${place} g6 still energy
    g7:
      move_energy:
        name: ${place} g7 move energy
      still_energy:
        name: ${place} g7 still energy
    g8:
      move_energy:
        name: ${place} g8 move energy
      still_energy:
